<style>
  :root{
    --bg:#05070a;
    --panel:#0d131c;
    --panel2:#121a26;
    --line:#1e2a3a;
    --accent:#2be8c8;
    --accent2:#7c8bff;
    --warn:#ffb020;
    --bad:#ff4d5e;
    --good:#34d399;
    --txt:#eaf3f2;
    --txt-dim:#8fa3ab;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overscroll-behavior:none;
    overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  .screen{display:none;position:absolute;inset:0;flex-direction:column;overflow-y:auto;}
  .screen.active{display:flex;}

  /* ---------- HOME ---------- */
  #screen-home{align-items:center;padding:28px 18px 40px;gap:18px;text-align:center;
    background:radial-gradient(circle at 50% -10%, #10202090 0%, transparent 55%), var(--bg);}
  .logo-wrap{width:150px;height:150px;margin-top:6px;filter:drop-shadow(0 0 18px #2be8c855);}
  h1.title{font-size:1.7rem;margin:2px 0 0;letter-spacing:.5px;}
  h1.title b{color:var(--accent);}
  .subtitle{color:var(--txt-dim);font-size:.92rem;margin:0 0 6px;line-height:1.5;max-width:340px;}
  .btn{appearance:none;border:none;border-radius:16px;padding:15px 26px;font-size:1.02rem;
    font-weight:700;cursor:pointer;width:100%;max-width:380px;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04140f;}
  .btn-ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);}
  .btn-sm{padding:10px 16px;font-size:.85rem;border-radius:12px;width:auto;}
  .home-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;margin-top:4px;}

  .gallery{width:100%;max-width:420px;margin-top:14px;}
  .gallery h3{font-size:.78rem;color:var(--txt-dim);text-align:left;margin:0 0 8px;font-weight:600;}
  .gallery-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .gcard{flex:0 0 auto;width:76px;text-align:center;background:var(--panel);border-radius:12px;
    padding:6px;border:1px solid var(--line);}
  .gcard img{width:100%;height:76px;object-fit:cover;border-radius:8px;display:block;}
  .gcard .score{font-size:.72rem;font-weight:700;margin-top:3px;}

  /* ---------- CAMERA ---------- */
  #screen-camera{background:#000;padding:0;overflow:hidden;}
  .cam-stage{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .cam-wrap{position:relative;width:100%;height:100%;transition:transform .08s linear;}
  .cam-wrap.mirrored{transform:scaleX(-1);}
  video#cam{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
  canvas#overlay{position:absolute;inset:0;width:100%;height:100%;}
  .cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:14px 14px calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(#000000cc,transparent);z-index:5;pointer-events:none;}
  .cam-top *{pointer-events:auto;}
  .icon-btn{width:40px;height:40px;border-radius:50%;background:#00000066;border:1px solid #ffffff33;
    color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}
  .status-pill{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%);background:#000000aa;border:1px solid #ffffff22;padding:9px 18px;
    border-radius:30px;font-size:.88rem;color:#fff;text-align:center;max-width:90%;z-index:5;
    transition:.15s;}
  .status-pill.ok{border-color:var(--good);color:var(--good);}
  .status-pill.warn{border-color:var(--warn);color:var(--warn);}
  .start-now-btn{position:absolute;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%);width:auto;max-width:none;padding:10px 22px;font-size:.9rem;z-index:5;}
  .countdown-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:8rem;font-weight:800;color:#fff;text-shadow:0 0 30px #2be8c8cc;z-index:6;
    pointer-events:none;transform:scaleX(1);}
  .cam-wrap.mirrored ~ .countdown-num, .cam-stage .countdown-num{transform:scaleX(1);}
  .capturing-badge{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;
    transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:700;font-size:.8rem;
    padding:6px 14px;border-radius:20px;z-index:6;}

  /* ---------- RESULT ---------- */
  #screen-result{padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));gap:14px;
    align-items:center;overflow-y:auto;}
  .result-top{display:flex;width:100%;max-width:420px;justify-content:space-between;align-items:center;flex-shrink:0;}
  .result-row{display:flex;gap:8px;width:100%;max-width:420px;align-items:stretch;flex-shrink:0;}
  .result-photo{position:relative;flex:1 1 auto;min-width:0;border-radius:20px;overflow:hidden;
    border:1px solid var(--line);background:#000;flex-shrink:0;}
  .result-photo canvas{width:100%;display:block;}
  .result-reference{flex:0 0 27%;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4px;}
  .ref-label{font-size:.66rem;color:var(--txt-dim);font-weight:600;text-align:center;}
  .result-reference svg{width:100%;height:auto;}
  .score-wrap{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;}
  .score-ring{position:relative;width:74px;height:74px;flex:0 0 auto;}
  .score-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
  .score-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:1.25rem;font-weight:800;}
  .score-meta{flex:1;}
  .score-meta .lbl{font-size:.78rem;color:var(--txt-dim);}
  .score-meta .verdict{font-size:1rem;font-weight:700;margin-top:2px;}
  .notes-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:16px 16px 10px;}
  .notes-card h3{margin:0 0 10px;font-size:.9rem;color:var(--accent);}
  .notes-card ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .notes-card li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.4;}
  .notes-card li .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent2);
    color:#0a0d16;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;}
  .notes-card.perfect{text-align:center;color:var(--good);font-weight:700;padding:20px;}
  .result-actions{display:flex;gap:10px;width:100%;max-width:420px;}
  .result-actions .btn{max-width:none;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f2420;
    border:1px solid var(--good);color:var(--good);padding:10px 20px;border-radius:30px;
    font-size:.85rem;z-index:50;font-weight:600;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <!-- ========== HOME ========== -->
  <section id="screen-home" class="screen active">
    <div class="logo-wrap">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <circle cx="100" cy="100" r="86" fill="none" stroke="#2be8c8" stroke-opacity=".35" stroke-width="2"/>

        <line x1="100" y1="168" x2="100" y2="20" stroke="#ffffff" stroke-opacity=".92" stroke-width="4" stroke-linecap="round"/>
        <line x1="100" y1="168" x2="100" y2="20" stroke="#ffffff" stroke-opacity=".25" stroke-width="7" stroke-linecap="round"/>
        <line x1="100" y1="110" x2="114" y2="98" stroke="#ffffff" stroke-opacity=".92" stroke-width="3" stroke-linecap="round"/>
        <g stroke="#04140f" stroke-width="1.6">
          <circle cx="100" cy="168" r="7" fill="#2be8c8"/>
          <circle cx="100" cy="140" r="6" fill="#ffd23f"/>
          <circle cx="100" cy="110" r="6.4" fill="#ff9f4a"/>
          <circle cx="100" cy="85" r="6" fill="#ff6b9d"/>
          <circle cx="100" cy="62" r="6.6" fill="#ff4d5e"/>
          <circle cx="100" cy="40" r="6" fill="#4dd0ff"/>
          <circle cx="100" cy="20" r="6" fill="#34d399"/>
          <circle cx="114" cy="98" r="5" fill="#c77dff"/>
        </g>
        <line x1="55" y1="175" x2="145" y2="175" stroke="#ffffff" stroke-opacity=".4" stroke-width="2" stroke-dasharray="2 5"/>
      </svg>
    </div>
    <h1 class="title">Hand<b>Stand</b>Line</h1>
    <p class="subtitle">Checks your body alignment in a handstand or an overhead-reach standing position — positions you, counts down, captures, and analyzes your body line.</p>

    <div class="home-actions">
      <button class="btn btn-primary" id="btnStart">Start Capture</button>
    </div>

    <div class="gallery" id="galleryWrap" style="display:none;">
      <h3>Recent Attempts</h3>
      <div class="gallery-strip" id="galleryStrip"></div>
    </div>
  </section>

  <!-- ========== CAMERA ========== -->
  <section id="screen-camera" class="screen">
    <div class="cam-stage">
      <div class="cam-wrap" id="camWrap">
        <video id="cam" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="countdown-num" id="countdownNum" style="display:none;"></div>
      <div class="capturing-badge" id="capBadge" style="display:none;">Capturing...</div>
    </div>
    <div class="cam-top">
      <button class="icon-btn" id="btnBack">✕</button>
      <button class="icon-btn" id="btnFlipCam">Flip</button>

    <div class="status-pill" id="statusPill">Initializing camera…</div>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="screen-result" class="screen">
    <div class="result-top">
      <button class="icon-btn" id="btnResultClose">✕</button>
      <div style="font-weight:700;font-size:.95rem;">Result</div>
      <div style="width:40px;"></div>
    </div>
    <div class="result-row">
      <div class="result-photo"><canvas id="resultCanvas"></canvas></div>
      <div class="result-reference">
        <div class="ref-label">Ideal form</div>
        <div id="refDiagram"></div>
      </div>
    </div>
    <div class="score-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="#1e2a3a" stroke-width="8"/>
          <circle id="scoreArc" cx="40" cy="40" r="34" fill="none" stroke="#2be8c8" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
        </svg>
        <div class="num" id="scoreNum">0</div>
      </div>
      <div class="score-meta">
        <div class="lbl">Body Line Alignment Score</div>
        <div class="verdict" id="scoreVerdict">—</div>
      </div>
    </div>
    <div class="notes-card" id="notesCard">
      <h3>What to Fix</h3>
      <ol id="notesList"></ol>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="btnRetry">Retry</button>
      <button class="btn btn-primary" id="btnSave">Save to Gallery</button>
    </div>
  </section>

</div>

<script type="module">
/* ============================================================
   HandStandLine
   Single-file MediaPipe PoseLandmarker alignment coach
   ============================================================ */

// ---------- Landmark indices (MediaPipe Pose, 33 pts) ----------
const L = {
  nose:0,
  lsh:11, rsh:12, lel:13, rel:14, lwr:15, rwr:16,
  lpinky:17, rpinky:18, lindex:19, rindex:20,
  lhip:23, rhip:24, lknee:25, rknee:26, lank:27, rank:28
};

const STORE_KEY = 'handstandline_gallery_v1';

// ---------- State ----------
const state = {
  facing: 'environment',
  mirrored:false,
  stream:null, video:null, landmarker:null,
  running:false,
  lockStart:null,
  countdownTimer:null,
  capturing:false,
  captureMaxEndAt:0,
  captureHasGood:false,
  captureLastGoodAt:0,
  bestFrame:null,        // {score, landmarks, dataUrl, w, h}
  lastResult:null
};

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const screens = { home:$('#screen-home'), camera:$('#screen-camera'), result:$('#screen-result') };
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

// ---------- Home UI wiring ----------
$('#btnStart').addEventListener('click', startCameraFlow);
$('#btnBack').addEventListener('click', stopCameraFlow);
$('#btnFlipCam').addEventListener('click', async ()=>{
  state.facing = state.facing==='environment' ? 'user' : 'environment';
  await setupCamera();
});
$('#btnStartNow').addEventListener('click', ()=>{
  if(state.capturing || state.countdownTimer) return;
  $('#btnStartNow').style.display='none';
  startCountdown();
});
$('#btnResultClose').addEventListener('click', ()=>{ showScreen('home'); renderGallery(); });
$('#btnRetry').addEventListener('click', startCameraFlow);
$('#btnSave').addEventListener('click', saveToGallery);

// ============================================================
// MediaPipe setup
// ============================================================
let visionTasks = null;
async function ensureLandmarker(){
  if(state.landmarker) return state.landmarker;
  try{
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    visionTasks = vision;
    const fileset = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    let landmarker;
    try{
      landmarker = await vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions:{
          modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate:'GPU'
        },
        runningMode:'VIDEO',
        numPoses:1
      });
    }catch(e){
      landmarker = await vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions:{
          modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate:'CPU'
        },
        runningMode:'VIDEO',
        numPoses:1
      });
    }
    state.landmarker = landmarker;
    return landmarker;
  }catch(err){
    console.error('MediaPipe load failed', err);
    setStatus('Failed to load the detection engine — check your internet connection and refresh', 'warn');
    throw err;
  }
}

// ============================================================
// Camera flow
// ============================================================
async function startCameraFlow(){
  showScreen('camera');
  resetCaptureState();
  setStatus('Initializing camera…');
  try{
    await ensureLandmarker();
    await setupCamera();
    state.running = true;
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
  }
}

function stopCameraFlow(){
  state.running = false;
  clearTimeout(state.countdownTimer);
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
  showScreen('home');
}

async function setupCamera(){
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); }
  const video = $('#cam');
  state.video = video;
  const constraints = { video:{ facingMode: state.facing, width:{ideal:960}, height:{ideal:1280}, aspectRatio:{ideal:0.75} }, audio:false };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  state.stream = stream;
  video.srcObject = stream;
  await new Promise(res=>{ video.onloadedmetadata = ()=>{ video.play(); res(); }; });
  state.mirrored = state.facing === 'user';
  resetAutoZoom();

  // start the physical lens as wide (zoomed-out) as the device allows, so less
  // stepping back is needed to fit the whole body in frame
  try{
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps && caps.zoom && typeof caps.zoom.min === 'number'){
      await track.applyConstraints({ advanced:[{ zoom: caps.zoom.min }] });
    }
  }catch(e){ /* zoom control not supported on this device/browser — ignore */ }

  fitOverlay();
}

function fitOverlay(){
  const video = state.video;
  const canvas = $('#overlay');
  const stage = document.querySelector('.cam-stage');
  const rect = stage.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
}
window.addEventListener('resize', fitOverlay);

function resetCaptureState(){
  state.lockStart = null;
  state.capturing = false;
  state.bestFrame = null;
  state.captureHasGood = false;
  clearTimeout(state.countdownTimer);
  $('#countdownNum').style.display='none';
  $('#capBadge').style.display='none';
  $('#btnStartNow').style.display='block';
}

// ============================================================
// Digital auto-framing — once the whole body is visible, smoothly
// crop/zoom the live preview around the person (extra headroom is
// reserved above for an overhead arm reach). Purely cosmetic: the
// actual captured photo is always grabbed from the raw, un-zoomed
// video frame, so this never affects detection or scoring.
// ============================================================
function resetAutoZoom(){
  state.zoomScale = 1; state.zoomCx = 0.5; state.zoomCy = 0.5;
  applyZoomTransform();
}
function lerpNum(a,b,t){ return a + (b-a)*t; }
function updateAutoZoom(gs){
  const camWrap = $('#camWrap');
  if(!camWrap) return;
  if(!gs || !gs.visible){
    state.zoomScale = lerpNum(state.zoomScale ?? 1, 1, 0.12);
    state.zoomCx = lerpNum(state.zoomCx ?? 0.5, 0.5, 0.12);
    state.zoomCy = lerpNum(state.zoomCy ?? 0.5, 0.5, 0.12);
    applyZoomTransform();
    return;
  }
  const padTop = 0.30, padBottom = 0.10, padSide = 0.35; // extra top room for hands/feet reaching overhead
  const bw = Math.max(0.05, gs.maxX-gs.minX);
  const bh = Math.max(0.05, gs.maxY-gs.minY);
  const boxW = bw*(1+2*padSide);
  const boxH = bh*(1+padTop+padBottom);
  const targetScale = Math.min(2.4, Math.max(1, 1/Math.max(boxW, boxH)));
  const targetCx = gs.cx;
  const targetCy = (gs.minY - bh*padTop + gs.maxY + bh*padBottom)/2;

  state.zoomScale = lerpNum(state.zoomScale ?? 1, targetScale, 0.1);
  state.zoomCx = lerpNum(state.zoomCx ?? 0.5, targetCx, 0.1);
  state.zoomCy = lerpNum(state.zoomCy ?? 0.5, targetCy, 0.1);
  applyZoomTransform();
}
function applyZoomTransform(){
  const camWrap = $('#camWrap');
  if(!camWrap) return;
  const s = state.zoomScale || 1;
  const dx = (0.5 - (state.zoomCx ?? 0.5)) * 100;
  const dy = (0.5 - (state.zoomCy ?? 0.5)) * 100;
  const mirror = state.mirrored ? 'scaleX(-1) ' : '';
  camWrap.style.transform = `${mirror}scale(${s}) translate(${dx}%, ${dy}%)`;
}

// ============================================================
// Main detection loop
// ============================================================
function loop(ts){
  if(!state.running) return;
  const video = state.video;
  if(video && video.readyState >= 2 && state.landmarker){
    const res = state.landmarker.detectForVideo(video, performance.now());
    const lms = (res.landmarks && res.landmarks[0]) ? res.landmarks[0] : null;
    processFrame(lms);
  }
  requestAnimationFrame(loop);
}

function processFrame(lms){
  const canvas = $('#overlay');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const liveGs = lms ? geomStatus(lms) : null;
  drawGuide(ctx,w,h, liveGs);
  updateAutoZoom(liveGs);

  if(!lms){
    if(state.capturing){ checkCaptureTimeout(); return; }
    setStatus('No body detected — step back and get in frame', 'warn');
    armLock(false);
    return;
  }

  const chips = buildChips(lms);
  drawSkeleton(ctx, chips, w, h);

  if(state.capturing){
    // extended capture window: keep scoring every frame the pose is
    // clearly visible, so a hold of any length (2s or 10s) gets caught —
    // finishes as soon as the pose is lost again, not on a fixed timer
    const capturable = liveGs && liveGs.visible && liveGs.inFrame;
    if(capturable){
      const analysis = analyzeAlignment(chips, liveGs);
      const dataUrl = snapshotVideo();
      if(!state.bestFrame || analysis.score > state.bestFrame.score){
        state.bestFrame = { score:analysis.score, chips, analysis, dataUrl, w:canvas.width, h:canvas.height, lms };
      }
      state.captureHasGood = true;
      state.captureLastGoodAt = performance.now();
      setStatus('Capturing — hold as long as you can…', 'ok');
    }else if(state.captureHasGood){
      setStatus('Lost the pose — wrapping up…', 'warn');
    }else{
      setStatus('Get into position — capturing now', 'ok');
    }
    checkCaptureTimeout();
    return;
  }

  const gs = liveGs;
  const ok = gs.inFrame && gs.centered && gs.visible;
  if(ok){
    setStatus(state.lockStart ? 'Great! Hold this position…' : 'Good position — locking…', 'ok');
    armLock(true);
  }else{
    setStatus(gs.message, 'warn');
    armLock(false);
  }
}

function checkCaptureTimeout(){
  const now = performance.now();
  if(now >= state.captureMaxEndAt){ finishCapture(); return; }
  if(state.captureHasGood && (now - state.captureLastGoodAt) > 700){ finishCapture(); }
}

function armLock(good){
  if(good){
    if(!state.lockStart) state.lockStart = performance.now();
    if(performance.now() - state.lockStart > 900 && !state.countdownTimer && !state.capturing){
      startCountdown();
    }
  }else{
    state.lockStart = null;
    if(state.countdownTimer){
      clearTimeout(state.countdownTimer);
      state.countdownTimer = null;
      $('#countdownNum').style.display='none';
      $('#btnStartNow').style.display='block';
    }
  }
}

const LEAD_IN_SECONDS = 3;
function startCountdown(){
  $('#btnStartNow').style.display='none';
  let n = LEAD_IN_SECONDS;
  const el = $('#countdownNum');
  el.style.display='flex';
  const tick = ()=>{
    el.textContent = n;
    el.style.animation='none'; void el.offsetWidth; el.style.animation='';
    if(n<=0){
      el.style.display='none';
      beginCapture();
      return;
    }
    n--;
    state.countdownTimer = setTimeout(tick, 1000);
  };
  tick();
}

function beginCapture(){
  state.capturing = true;
  state.countdownTimer = null;
  state.bestFrame = null;
  state.captureHasGood = false;
  state.captureLastGoodAt = performance.now();
  state.captureMaxEndAt = performance.now() + 9000; // hard cap — most attempts finish sooner
  $('#capBadge').style.display='block';
  $('#btnStartNow').style.display='none';
  setStatus('Get into position — capturing now', 'ok');
}

function finishCapture(){
  state.capturing = false;
  $('#capBadge').style.display='none';
  clearTimeout(state.countdownTimer);
  if(!state.bestFrame){
    // never got a clear, in-frame view of the pose — let them try again
    // instead of showing a broken/empty result
    state.lockStart = null;
    setStatus('Could not get a clear shot — get in position and try again', 'warn');
    $('#btnStartNow').style.display='block';
    return; // state.running stays true — the detection loop keeps going
  }
  state.running = false;
  state.lastResult = state.bestFrame;
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
  renderResult(state.lastResult);
  showScreen('result');
}

function snapshotVideo(){
  const video = state.video;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  const ctx = c.getContext('2d');
  if(state.mirrored){
    ctx.translate(c.width,0); ctx.scale(-1,1);
  }
  ctx.drawImage(video,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.86);
}

function setStatus(msg, cls){
  const el = $('#statusPill');
  el.textContent = msg;
  el.className = 'status-pill' + (cls?(' '+cls):'');
}

// ============================================================
// Geometry helpers
// ============================================================
function vis(lms,i){ return lms[i] ? (lms[i].visibility ?? 1) : 0; }
function pt(lms,i){ return {x:lms[i].x, y:lms[i].y}; }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function lerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function detectView(lms){
  // primary signal: left/right visibility asymmetry. A true profile/side
  // view means one whole side of the body is occluded behind the other,
  // so its landmarks come back consistently less confident; a front view
  // has both sides similarly visible.
  const leftVis = (vis(lms,L.lsh)+vis(lms,L.lel)+vis(lms,L.lwr)+vis(lms,L.lhip)+vis(lms,L.lknee)+vis(lms,L.lank))/6;
  const rightVis = (vis(lms,L.rsh)+vis(lms,L.rel)+vis(lms,L.rwr)+vis(lms,L.rhip)+vis(lms,L.rknee)+vis(lms,L.rank))/6;
  const visDiff = Math.abs(leftVis - rightVis);

  // secondary/confirming signal: how compressed the shoulders look on screen
  const shX = Math.abs(lms[L.lsh].x - lms[L.rsh].x);
  const bodyH = Math.abs(mid(pt(lms,L.lsh),pt(lms,L.rsh)).y - mid(pt(lms,L.lank),pt(lms,L.rank)).y) || 0.3;
  const geomRatio = shX / bodyH;

  // only call it "profile" when BOTH a real occlusion is visible AND the
  // shoulders read as compressed — a single noisy signal isn't enough,
  // which is what was misclassifying clean front-facing shots before
  return (visDiff > 0.22 && geomRatio < 0.16) ? 'profile' : 'front';
}
function detectStance(lms){
  const shY = mid(pt(lms,L.lsh),pt(lms,L.rsh)).y;
  const ankY = mid(pt(lms,L.lank),pt(lms,L.rank)).y;
  return ankY < shY ? 'handstand' : 'standing'; // ankles higher up (smaller y) => inverted
}
function betterSide(lms){
  const lV = vis(lms,L.lsh)+vis(lms,L.lhip)+vis(lms,L.lknee)+vis(lms,L.lank);
  const rV = vis(lms,L.rsh)+vis(lms,L.rhip)+vis(lms,L.rknee)+vis(lms,L.rank);
  return rV>=lV ? 'r' : 'l';
}

function geomStatus(lms){
  const view = detectView(lms);
  let need;
  if(view === 'profile'){
    const side = betterSide(lms);
    need = side==='r' ? [L.rsh,L.rel,L.rwr,L.rhip,L.rknee,L.rank] : [L.lsh,L.lel,L.lwr,L.lhip,L.lknee,L.lank];
  }else{
    need = [L.lsh,L.rsh,L.lel,L.rel,L.lwr,L.rwr,L.lhip,L.rhip,L.lknee,L.rknee,L.lank,L.rank];
  }
  const visThresh = view === 'profile' ? 0.3 : 0.35;
  const visible = need.every(i => vis(lms,i) > visThresh);
  const xs = need.map(i=>lms[i].x), ys = need.map(i=>lms[i].y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const bh = maxY-minY;
  const cx = (minX+maxX)/2;
  const inFrame = bh > 0.5 && bh < 0.98 && minY > 0.01 && maxY < 0.99;
  const centered = cx > 0.28 && cx < 0.72;
  let message = 'Center yourself in frame so your whole body is visible';
  if(!visible) message = 'Part of your body is not detected — check lighting and camera angle';
  else if(bh <= 0.5) message = 'Move a bit closer to the camera';
  else if(bh >= 0.98) message = 'Move a bit further from the camera';
  else if(!centered) message = 'Move to the center of the frame';
  return { visible, inFrame, centered, message, bh, cx, view, minX, maxX, minY, maxY };
}

function buildChips(lms){
  const view = detectView(lms);
  const stance = detectStance(lms);
  const side = betterSide(lms);
  const S = side==='r' ? {sh:L.rsh,el:L.rel,wr:L.rwr,hip:L.rhip,knee:L.rknee,ank:L.rank}
                       : {sh:L.lsh,el:L.lel,wr:L.lwr,hip:L.lhip,knee:L.lknee,ank:L.lank};
  const F = side==='r' ? {hip:L.lhip,knee:L.lknee,ank:L.lank}
                       : {hip:L.rhip,knee:L.rknee,ank:L.rank};

  function chipsFor(){
    if(view==='profile'){
      const wrist = pt(lms,S.wr);
      const elbow = pt(lms,S.el);
      const shoulder = pt(lms,S.sh);
      const hip = pt(lms,S.hip);
      const knee = pt(lms,S.knee);
      const ankle = pt(lms,S.ank);
      const ribs = lerp(shoulder, hip, 0.35);
      // T1 vertebra / base-of-neck proxy: partway from shoulder toward the nose
      const neckT1 = lerp(shoulder, pt(lms,L.nose), 0.35);
      const farVis = (vis(lms,F.hip)+vis(lms,F.knee)+vis(lms,F.ank))/3;
      return { view, stance, side,
        wrist, elbow, shoulder, neckT1, ribs, hip, knee, ankle,
        // for note-angle math
        elbowA:{a:shoulder,b:elbow,c:wrist}, kneeA:{a:hip,b:knee,c:ankle},
        farHip:pt(lms,F.hip), farKnee:pt(lms,F.knee), farAnkle:pt(lms,F.ank), farVis,
        lineRef:[wrist,elbow,shoulder,neckT1,ribs,hip,knee,ankle]
      };
    }else{
      const wrist = mid(pt(lms,L.lwr),pt(lms,L.rwr));
      const elbow = mid(pt(lms,L.lel),pt(lms,L.rel));
      const shoulder = mid(pt(lms,L.lsh),pt(lms,L.rsh));
      const hip = mid(pt(lms,L.lhip),pt(lms,L.rhip));
      const knee = mid(pt(lms,L.lknee),pt(lms,L.rknee));
      const ankle = mid(pt(lms,L.lank),pt(lms,L.rank));
      const ribs = lerp(shoulder, hip, 0.35);
      const neckT1 = lerp(shoulder, pt(lms,L.nose), 0.35);
      return { view, stance, side,
        wrist, elbow, shoulder, neckT1, ribs, hip, knee, ankle,
        shL:pt(lms,L.lsh), shR:pt(lms,L.rsh), hipL:pt(lms,L.lhip), hipR:pt(lms,L.rhip),
        wristL:pt(lms,L.lwr), wristR:pt(lms,L.rwr),
        kneeL:pt(lms,L.lknee), kneeR:pt(lms,L.rknee), ankL:pt(lms,L.lank), ankR:pt(lms,L.rank),
        elbowA:{a:shoulder,b:elbow,c:wrist}, kneeA:{a:hip,b:knee,c:ankle},
        lineRef:[wrist,elbow,shoulder,neckT1,ribs,hip,knee,ankle]
      };
    }
  }
  return chipsFor();
}

function angleAt(a,b,c){
  const v1 = {x:a.x-b.x,y:a.y-b.y}, v2 = {x:c.x-b.x,y:c.y-b.y};
  const dot = v1.x*v2.x+v1.y*v2.y;
  const m1 = Math.hypot(v1.x,v1.y), m2 = Math.hypot(v2.x,v2.y);
  if(m1===0||m2===0) return 180;
  let cos = dot/(m1*m2);
  cos = Math.max(-1,Math.min(1,cos));
  return Math.acos(cos) * 180/Math.PI;
}

// total-least-squares best fit line through points -> {point, dir(unit)}
function fitLine(points){
  const n = points.length;
  const cx = points.reduce((s,p)=>s+p.x,0)/n;
  const cy = points.reduce((s,p)=>s+p.y,0)/n;
  let sxx=0, sxy=0, syy=0;
  points.forEach(p=>{ const dx=p.x-cx, dy=p.y-cy; sxx+=dx*dx; sxy+=dx*dy; syy+=dy*dy; });
  const theta = 0.5*Math.atan2(2*sxy, sxx-syy);
  const dir = {x:Math.cos(theta), y:Math.sin(theta)};
  return { origin:{x:cx,y:cy}, dir };
}
function perpDist(p, line){
  const n = {x:-line.dir.y, y:line.dir.x};
  return (p.x-line.origin.x)*n.x + (p.y-line.origin.y)*n.y; // signed
}

// ============================================================
// Alignment analysis -> notes + score
// ============================================================
function analyzeAlignment(chips, gs){
  const notes = [];
  let score = 100;
  const isFront = chips.view === 'front';

  const line = fitLine(chips.lineRef);
  const bodyLen = dist(chips.shoulder, chips.ankle) || 0.3;

  // colinearity (how well all points sit on one straight line).
  // Front view can't see forward/back arching (that plane is invisible
  // face-on), so this signal is weighted lighter there and profile view
  // carries the strict version of this check.
  const devs = chips.lineRef.map(p => Math.abs(perpDist(p, line)));
  const rms = Math.sqrt(devs.reduce((s,d)=>s+d*d,0)/devs.length) / bodyLen;
  const colinCap = isFront ? 16 : 38;
  const colinPenalty = Math.min(colinCap, rms * (isFront ? 300 : 700));
  score -= colinPenalty;

  // verticality of the stack line
  const tiltDeg = 90 - Math.abs((Math.atan2(Math.abs(line.dir.y), Math.abs(line.dir.x)))*180/Math.PI);
  const tiltCap = isFront ? 8 : 16;
  const tiltPenalty = Math.min(tiltCap, Math.abs(tiltDeg)*(isFront?0.5:0.8));
  score -= tiltPenalty;

  // elbows
  const elbowAngle = angleAt(chips.elbowA.a, chips.elbowA.b, chips.elbowA.c);
  if(elbowAngle < 165){
    notes.push('Straighten elbows');
    score -= Math.min(24, (165-elbowAngle)*1.3);
  }

  // knees (near/front leg)
  const kneeAngle = angleAt(chips.kneeA.a, chips.kneeA.b, chips.kneeA.c);
  if(kneeAngle < 170){
    notes.push('Engage quads (straighten knees)');
    score -= Math.min(24, (170-kneeAngle)*1.3);
  }

  // hip / shoulder / neck deviation from the line -> belly / shoulder / glute cues
  // (secondary signal on front view — see colinearity note above)
  const hipDev = perpDist(chips.hip, line) / bodyLen;
  const shDev = perpDist(chips.shoulder, line) / bodyLen;
  const neckDev = perpDist(chips.neckT1, line) / bodyLen;
  const THRESH = isFront ? 0.03 : 0.018;
  const devCap = isFront ? 10 : 22;
  const devMult = isFront ? 160 : 340;
  if(Math.abs(hipDev) > THRESH){
    if(hipDev > 0) notes.push('Engage core / tuck belly (hips tilt forward off the line)');
    else notes.push('Squeeze glutes (hips pushed back off the line)');
    score -= Math.min(devCap, Math.abs(hipDev)*devMult);
  }
  if(Math.abs(shDev) > THRESH){
    notes.push('Open shoulders (shoulders off the body line)');
    score -= Math.min(devCap, Math.abs(shDev)*devMult);
  }
  if(Math.abs(neckDev) > THRESH){
    notes.push('Keep head/neck in line (tucked too far in or out)');
    score -= Math.min(devCap*0.8, Math.abs(neckDev)*devMult);
  }

  // front/back view — this is where the camera can actually see adduction,
  // so legs together & hands together are the primary scored checks here
  if(isFront){
    const kneeGap = dist(chips.kneeL, chips.kneeR) / bodyLen;
    const ankGap = dist(chips.ankL, chips.ankR) / bodyLen;
    const hipGap = dist(chips.hipL, chips.hipR) / bodyLen;
    const wristGap = dist(chips.wristL, chips.wristR) / bodyLen;
    const shGap = dist(chips.shL, chips.shR) / bodyLen;
    if(kneeGap > hipGap*0.65){ notes.push('Bring knees together'); score -= 16; }
    if(ankGap > hipGap*0.65){ notes.push('Bring ankles together'); score -= 16; }
    if(wristGap > shGap*0.35){ notes.push('Bring hands closer together'); score -= 16; }

    // two straight lines: shoulder line & hip line should be level (perpendicular to stack line)
    const shAngle = Math.atan2(chips.shR.y-chips.shL.y, chips.shR.x-chips.shL.x)*180/Math.PI;
    const hipAngle = Math.atan2(chips.hipR.y-chips.hipL.y, chips.hipR.x-chips.hipL.x)*180/Math.PI;
    if(Math.abs(shAngle) > 6){ notes.push('Level out the shoulders (shoulder line not level)'); score -= 8; }
    if(Math.abs(hipAngle) > 6){ notes.push('Level out the hips (hip line not level)'); score -= 8; }
  }

  // profile view — check the far (hidden) leg too, when MediaPipe can still estimate it
  if(!isFront && chips.farVis > 0.15){
    const farKneeAngle = angleAt(chips.farHip, chips.farKnee, chips.farAnkle);
    if(farKneeAngle < 168){
      notes.push('Straighten the back (hidden) leg — it is bent and breaking the hip line');
      score -= Math.min(20, (168-farKneeAngle)*1.1);
    }
    const legGap = dist(chips.ankle, chips.farAnkle) / bodyLen;
    if(legGap > 0.05){
      notes.push('Bring your legs/feet together — the back leg is drifting apart');
      score -= 10;
    }
  }

  // never claim a clean result while the overall line is visibly off —
  // if no specific joint issue tripped but the line itself is crooked,
  // say so instead of reporting a false "perfect"
  if(notes.length===0 && (colinPenalty+tiltPenalty) > 6){
    notes.push('Overall body line is not fully straight — compare against the reference line beside you');
  }

  score = Math.max(0, Math.min(100, Math.round(score)));
  // de-duplicate notes while preserving order
  const uniq = [...new Set(notes)];
  return { score, notes: uniq, line };
}

// ============================================================
// Drawing (guide + skeleton) — used live AND on results
// ============================================================
function drawGuide(ctx,w,h,gs){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.setLineDash([4,7]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.setLineDash([]);
  const boxColor = gs && gs.inFrame && gs.centered && gs.visible ? '#34d399' : '#ffb020';
  ctx.strokeStyle = boxColor;
  ctx.lineWidth = 2;
  const margin = w*0.14;
  const r = 22;
  roundRect(ctx, margin, h*0.05, w-margin*2, h*0.9, r);
  ctx.stroke();
  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

const CHIP_COLORS = {
  wrist:'#2be8c8', elbow:'#ffd23f', shoulder:'#ff9f4a', neckT1:'#c77dff',
  ribs:'#ff6b9d', hip:'#ff4d5e', knee:'#4dd0ff', ankle:'#34d399'
};
const CHIP_ORDER = ['wrist','elbow','shoulder','ribs','hip','knee','ankle'];
const CHIP_LABELS = {wrist:'Wrist',elbow:'Elbow',shoulder:'Shoulder',neckT1:'Neck (T1)',ribs:'Ribs',hip:'Pelvis',knee:'Knee',ankle:'Ankle'};

// a thin, round-capped white stroke with just a touch of volume — a plain
// tracking skeleton that reads clearly and moves cleanly with the person
function strokeBone(ctx, x1,y1,x2,y2, width){
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, width*0.4);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
// a small colour-coded chip marker at each anatomical landmark
function drawJoint(ctx, x, y, r, color){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = Math.max(1, r*0.35);
  ctx.strokeStyle = '#04140f';
  ctx.stroke();
}

// simple tracking skeleton: thin white bones (slight volume) + small
// colour-coded chip dots at the correct anatomical points — used live and
// on the result photo
function drawSkeleton(ctx, chips, w, h){
  ctx.save();
  const boneW = Math.max(4, Math.min(w,h)*0.014);
  const P = k => ({x:chips[k].x*w, y:chips[k].y*h});
  const chainPts = CHIP_ORDER.map(P);
  const neckP = P('neckT1');
  const shP = P('shoulder');

  for(let i=0;i<chainPts.length-1;i++){
    strokeBone(ctx, chainPts[i].x,chainPts[i].y, chainPts[i+1].x,chainPts[i+1].y, boneW);
  }
  strokeBone(ctx, shP.x,shP.y, neckP.x,neckP.y, boneW*0.8);

  CHIP_ORDER.forEach(k=>{
    const p = chips[k];
    drawJoint(ctx, p.x*w, p.y*h, boneW*1.7, CHIP_COLORS[k]);
  });
  drawJoint(ctx, neckP.x, neckP.y, boneW*1.4, CHIP_COLORS.neckT1);
  ctx.restore();
}

// a small "how it should look if perfect" reference diagram for the
// detected view/stance combo, shown beside the result photo
function referenceDiagramSVG(view, stance){
  const isHandstand = stance === 'handstand';
  const Y = isHandstand
    ? { wrist:150, elbow:125, shoulder:98, ribs:75, hip:55, knee:32, ankle:14 }
    : { ankle:155, knee:130, hip:103, ribs:80, shoulder:58, elbow:33, wrist:15 };
  const neckY = Y.shoulder - 8;
  const cx = 50;
  const order = isHandstand
    ? ['wrist','elbow','shoulder','ribs','hip','knee','ankle']
    : ['ankle','knee','hip','ribs','shoulder','elbow','wrist'];

  let bones = '';
  for(let i=0;i<order.length-1;i++){
    bones += `<line x1="${cx}" y1="${Y[order[i]]}" x2="${cx}" y2="${Y[order[i+1]]}" stroke="rgba(255,255,255,.85)" stroke-width="3.4" stroke-linecap="round"/>`;
  }
  bones += `<line x1="${cx}" y1="${Y.shoulder}" x2="${cx+9}" y2="${neckY}" stroke="rgba(255,255,255,.85)" stroke-width="2.6" stroke-linecap="round"/>`;

  let dots = order.map(k=>`<circle cx="${cx}" cy="${Y[k]}" r="4.4" fill="${CHIP_COLORS[k]}" stroke="#04140f" stroke-width="1.2"/>`).join('');
  dots += `<circle cx="${cx+9}" cy="${neckY}" r="3.6" fill="${CHIP_COLORS.neckT1}" stroke="#04140f" stroke-width="1.2"/>`;

  let extras = '';
  if(view === 'front'){
    // front view's ideal: hands together, feet together, level shoulder/hip lines
    extras += `<circle cx="${cx-5}" cy="${Y.wrist}" r="3.2" fill="${CHIP_COLORS.wrist}" stroke="#04140f" stroke-width="1"/>`;
    extras += `<circle cx="${cx+5}" cy="${Y.wrist}" r="3.2" fill="${CHIP_COLORS.wrist}" stroke="#04140f" stroke-width="1"/>`;
    extras += `<circle cx="${cx-4}" cy="${Y.ankle}" r="3" fill="${CHIP_COLORS.ankle}" stroke="#04140f" stroke-width="1"/>`;
    extras += `<circle cx="${cx+4}" cy="${Y.ankle}" r="3" fill="${CHIP_COLORS.ankle}" stroke="#04140f" stroke-width="1"/>`;
    extras += `<line x1="${cx-9}" y1="${Y.shoulder}" x2="${cx+9}" y2="${Y.shoulder}" stroke="rgba(255,159,74,.7)" stroke-width="1.6"/>`;
    extras += `<line x1="${cx-8}" y1="${Y.hip}" x2="${cx+8}" y2="${Y.hip}" stroke="rgba(255,77,94,.7)" stroke-width="1.6"/>`;
  }
  const groundY = isHandstand ? Y.wrist+6 : Y.ankle+6;

  return `<svg viewBox="0 0 100 170" xmlns="http://www.w3.org/2000/svg">
    ${bones}${extras}${dots}
    <line x1="30" y1="${groundY}" x2="70" y2="${groundY}" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-dasharray="2 4"/>
  </svg>`;
}

// ============================================================
// Results rendering
// ============================================================
function renderResult(frame){
  if(!frame){ return; }
  const canvas = $('#resultCanvas');
  const img = new Image();
  img.onload = ()=>{
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0);
    drawSkeleton(ctx, frame.chips, canvas.width, canvas.height);
  };
  img.src = frame.dataUrl;
  $('#refDiagram').innerHTML = referenceDiagramSVG(frame.chips.view, frame.chips.stance);

  const { score, notes } = frame.analysis;
  const circumference = 213.6;
  const offset = circumference * (1 - score/100);
  const arc = $('#scoreArc');
  arc.style.stroke = score>=80?'#34d399':score>=55?'#ffb020':'#ff4d5e';
  arc.setAttribute('stroke-dashoffset', offset);
  $('#scoreNum').textContent = score;
  $('#scoreVerdict').textContent = score>=90?'Excellent alignment!':score>=75?'Good alignment':score>=55?'Needs improvement':'Not aligned';

  const list = $('#notesList');
  const card = $('#notesCard');
  list.innerHTML = '';
  if(notes.length===0 && score>=90){
    card.classList.add('perfect');
    card.innerHTML = '✓ Perfectly aligned body line — great job!';
  }else if(notes.length===0){
    card.classList.remove('perfect');
    card.innerHTML = '<h3>What to Fix</h3><p style="margin:0;color:var(--txt-dim);font-size:.9rem;">No single joint issue stood out, but the score reflects the overall line — compare against the ideal form diagram.</p>';
  }else{
    card.classList.remove('perfect');
    card.innerHTML = '<h3>What to Fix</h3><ol id="notesList"></ol>';
    const ol = $('#notesList');
    notes.forEach((n,i)=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">${i+1}</span><span>${n}</span>`;
      ol.appendChild(li);
    });
  }
}

// ============================================================
// Gallery (localStorage)
// ============================================================
function loadGallery(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ return []; }
}
function saveToGallery(){
  const frame = state.lastResult;
  if(!frame) return;
  const gallery = loadGallery();
  gallery.unshift({
    ts: Date.now(),
    score: frame.analysis.score,
    thumb: frame.dataUrl,
    view: frame.chips.view,
    stance: frame.chips.stance
  });
  while(gallery.length > 12) gallery.pop();
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(gallery));
    toast('Saved to gallery');
  }catch(e){
    toast('Save failed (storage full)');
  }
}
function renderGallery(){
  const gallery = loadGallery();
  const wrap = $('#galleryWrap');
  const strip = $('#galleryStrip');
  if(gallery.length===0){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  strip.innerHTML='';
  gallery.forEach(g=>{
    const d = document.createElement('div');
    d.className='gcard';
    const color = g.score>=80?'var(--good)':g.score>=55?'var(--warn)':'var(--bad)';
    d.innerHTML = `<img src="${g.thumb}"><div class="score" style="color:${color}">${g.score}</div>`;
    strip.appendChild(d);
  });
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}

renderGallery();
</script>
